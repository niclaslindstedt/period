<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. -->
<html lang="en" data-theme="githubDark">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `maximum-scale=1, user-scalable=no` disables pinch-zoom and iOS's
         focus auto-zoom; `viewport-fit=cover` lets the app paint under the
         notch / home indicator (it pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12101a"
      media="(prefers-color-scheme: dark)"
    />
    <title>Cycle</title>
    <meta
      name="description"
      content="Cycle is a local-first period and cycle tracking PWA. Log bleeding, mood, lust, sex, temperature and ovulation tests each day, then read your cycle history and a forecast of the next period and fertile window. Your reports stay on your device, and sync to Dropbox — encrypted with your own passphrase — only if you connect one."
    />
    <!-- The web edition is not meant to be found: people find the app on the
         App Store and apps.agilator.se, so search engines are asked not to
         index this page (robots.txt still allows the fetch that reads it). -->
    <meta name="robots" content="noindex" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cycle" />
    <meta
      property="og:description"
      content="A privacy-first cycle tracker: log bleeding, mood, lust, sex, temperature and ovulation tests daily, see your cycle history, and get a forecast of the next period and fertile window. No account, no server."
    />
    <meta property="og:url" content="https://cycle.niclaslindstedt.se/" />
    <meta
      property="og:image"
      content="https://cycle.niclaslindstedt.se/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cycle" />
    <meta
      name="twitter:description"
      content="A privacy-first cycle tracker: log bleeding, mood, lust, sex, temperature and ovulation tests daily, see your cycle history and a forecast of the next period. No account, no server."
    />
    <meta
      name="twitter:image"
      content="https://cycle.niclaslindstedt.se/og.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
