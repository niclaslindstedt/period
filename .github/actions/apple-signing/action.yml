name: apple-signing
description: >
  Unlock a Developer ID certificate so the macOS bundle is signed — and, with
  the Apple account configured, notarized — for real.

  With no certificate this is a no-op with a warning, and nothing is exported:
  the package is made exactly as it is without this action, so a fork or a
  repository with no Apple account still packages. A signing identity is
  NEVER exported without its certificate imported first — an identity the
  runner's keychain cannot find fails the build instead of falling back.

  On success it exports, for the steps that follow, APPLE_SIGNING_IDENTITY
  (read by `tauri build`) and KEYCHAIN_PATH; and, when all three are given,
  APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID, which the bundler uses to
  notarize the signed app. Notarization therefore only ever follows a real
  signature.

inputs:
  certificate:
    description: >
      The Developer ID Application certificate as a base64-encoded .p12
      (`base64 -i cert.p12`). Empty means no real signature.
    required: false
    default: ""
  certificate-password:
    description: The password the .p12 was exported with.
    required: false
    default: ""
  identity:
    description: >
      An explicit signing identity, e.g. `Developer ID Application: Name
      (TEAMID)`. Optional — without it the identity is read back out of the
      imported certificate, which is one fewer secret to keep in step with a
      renewed cert. Ignored when there is no certificate.
    required: false
    default: ""
  apple-id:
    description: The Apple Account email notarization submits as.
    required: false
    default: ""
  apple-password:
    description: An app-specific password for that Apple Account.
    required: false
    default: ""
  apple-team-id:
    description: The Developer team ID the certificate belongs to.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Import the Developer ID certificate
      shell: bash
      env:
        CERTIFICATE: ${{ inputs.certificate }}
        CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
        EXPLICIT_IDENTITY: ${{ inputs.identity }}
        NOTARY_APPLE_ID: ${{ inputs.apple-id }}
        NOTARY_PASSWORD: ${{ inputs.apple-password }}
        NOTARY_TEAM_ID: ${{ inputs.apple-team-id }}
      run: |
        set -euo pipefail

        # No certificate: say so and export nothing, so the package is made
        # exactly as it would be without this action. An identity on its own
        # is deliberately ignored — a hosted runner's keychain has no key for
        # it, and `codesign` would fail rather than fall back.
        if [ -z "$CERTIFICATE" ]; then
          if [ -n "$EXPLICIT_IDENTITY" ] || [ -n "$NOTARY_APPLE_ID" ]; then
            echo "::warning::MAC_SIGN_IDENTITY / APPLE_ID are set but MAC_CSC_LINK is not — they are ignored until the certificate is configured too."
          fi
          echo "::warning::No Developer ID certificate configured — the macOS app is not signed with a Developer ID or notarized, and the first launch will be refused until the user allows it in System Settings."
          exit 0
        fi

        # A throwaway keychain rather than the login one: it is unlocked with
        # a password nothing else knows, it is destroyed with the runner, and
        # it cannot collide with whatever else a hosted macOS image carries.
        KEYCHAIN="$RUNNER_TEMP/apple-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
        CERT_PATH="$RUNNER_TEMP/certificate.p12"

        printf '%s' "$CERTIFICATE" | base64 --decode > "$CERT_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        # Six hours, and no lock-on-sleep: a Rust build is long enough that a
        # default-locked keychain fails at the codesign step and nowhere else.
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security
        # Without this, codesign finds the key and then blocks on a GUI prompt
        # that no runner can answer.
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
        # Search order, so a plain `codesign` that was given no keychain still
        # looks here first.
        security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
        rm -f "$CERT_PATH"

        if [ -n "$EXPLICIT_IDENTITY" ]; then
          IDENTITY="$EXPLICIT_IDENTITY"
        else
          # `|| true` so an empty result reaches the error below with
          # something to say, rather than tripping `set -e` first.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(.*\)".*/\1/p' | head -n1 || true)
        fi

        if [ -z "$IDENTITY" ]; then
          echo "::error::the certificate imported but no code-signing identity came out of it — is it a Developer ID Application certificate, exported with its private key?"
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          exit 1
        fi

        echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
        echo "Signing as: $IDENTITY"

        # Notarization only with all three, and only after a real signature:
        # the bundler submits a signed app to Apple and staples the ticket.
        # `APPLE_PASSWORD` is the bundler's name for an app-specific password.
        if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
          {
            echo "APPLE_ID=$NOTARY_APPLE_ID"
            echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Notarization configured."
        else
          echo "::warning::Signed, but APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are not all set — the app will not be notarized, and the first launch will still be refused until the user allows it."
        fi
