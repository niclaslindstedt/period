<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app mark: a droplet inside an open cycle ring, drawn as a
       top-to-bottom gradient on the app's dark surface — the line-art style
       shared with the sibling notes and contacts apps, in a distinct rose
       (they wear green and blue). The gap at the top right is what makes the
       ring read as a cycle rather than a plain circle. The PNG install icons
       are generated from the same geometry by scripts/generate-icons.mjs
       (`npm run icons`). -->
  <defs>
    <linearGradient id="mark" x1="0" y1="10" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#12101a"/>
  <!-- The ring, opened between 7° and 52° clockwise from twelve o'clock. -->
  <path d="M55 10.3 A40 40 0 1 1 81.5 26.1"
        fill="none" stroke="url(#mark)" stroke-width="8" stroke-linecap="round"/>
  <!-- The droplet: a disc at (50, 58) r=15 with sides tapering to a point at
       (50, 30). -->
  <path d="M50 30 C53 44 65 47 65 58 A15 15 0 1 1 35 58 C35 47 47 44 50 30Z"
        fill="url(#mark)"/>
</svg>
